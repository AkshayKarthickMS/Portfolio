<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230">
  <defs>
    <linearGradient id="mchbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151030"/>
      <stop offset="100%" stop-color="#0d0a1f"/>
    </linearGradient>
    <linearGradient id="mchbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00cea8"/>
      <stop offset="100%" stop-color="#0a7a63"/>
    </linearGradient>
  </defs>
  <rect width="400" height="230" fill="url(#mchbg)"/>
  <!-- map dots -->
  <g fill="#804dee" opacity="0.35">
    <circle cx="60" cy="40" r="3"/>
    <circle cx="90" cy="55" r="2"/>
    <circle cx="40" cy="70" r="2.5"/>
    <circle cx="110" cy="30" r="2"/>
    <circle cx="70" cy="90" r="3"/>
  </g>
  <!-- bar chart -->
  <g>
    <rect x="40" y="150" width="24" height="50" rx="3" fill="url(#mchbar)"/>
    <rect x="76" y="120" width="24" height="80" rx="3" fill="url(#mchbar)" opacity="0.9"/>
    <rect x="112" y="100" width="24" height="100" rx="3" fill="url(#mchbar)" opacity="0.8"/>
    <rect x="148" y="135" width="24" height="65" rx="3" fill="url(#mchbar)" opacity="0.95"/>
  </g>
  <!-- trend line -->
  <polyline points="210,150 250,120 290,135 330,90 360,105" fill="none" stroke="#f272c8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#f272c8">
    <circle cx="210" cy="150" r="4"/>
    <circle cx="250" cy="120" r="4"/>
    <circle cx="290" cy="135" r="4"/>
    <circle cx="330" cy="90" r="4"/>
    <circle cx="360" cy="105" r="4"/>
  </g>
  <!-- health cross badge -->
  <g transform="translate(300,40)">
    <circle r="26" fill="#1d1836" stroke="#00cea8" stroke-width="2"/>
    <rect x="-4" y="-14" width="8" height="28" rx="2" fill="#00cea8"/>
    <rect x="-14" y="-4" width="28" height="8" rx="2" fill="#00cea8"/>
  </g>
  <text x="200" y="220" font-family="Arial, sans-serif" font-size="13" fill="#aaa6c3" text-anchor="middle" letter-spacing="1">IMMUNIZATION ANALYTICS</text>
</svg>
