<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230">
  <defs>
    <linearGradient id="btbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151030"/>
      <stop offset="100%" stop-color="#0d0a1f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="230" fill="url(#btbg)"/>
  <!-- MRI scan slice -->
  <rect x="140" y="35" width="120" height="120" rx="10" fill="#0d0a1f" stroke="#3a3560" stroke-width="2"/>
  <ellipse cx="200" cy="95" rx="48" ry="52" fill="none" stroke="#aaa6c3" stroke-width="2" opacity="0.6"/>
  <ellipse cx="200" cy="95" rx="30" ry="34" fill="none" stroke="#aaa6c3" stroke-width="1.5" opacity="0.4"/>
  <!-- tumor highlight -->
  <circle cx="215" cy="82" r="12" fill="#f272c8" opacity="0.85"/>
  <circle cx="215" cy="82" r="20" fill="none" stroke="#f272c8" stroke-width="2" stroke-dasharray="3 3"/>
  <!-- scan line -->
  <line x1="140" y1="70" x2="260" y2="70" stroke="#00cea8" stroke-width="1" opacity="0.5"/>
  <!-- detection brackets -->
  <g stroke="#00cea8" stroke-width="2" fill="none">
    <path d="M120 40 h-15 v15"/>
    <path d="M280 40 h15 v15"/>
    <path d="M120 150 h-15 v-15"/>
    <path d="M280 150 h15 v-15"/>
  </g>
  <!-- confidence bar -->
  <g transform="translate(140,175)">
    <rect width="120" height="8" rx="4" fill="#1d1836"/>
    <rect width="94" height="8" rx="4" fill="#f272c8"/>
  </g>
  <text x="200" y="212" font-family="Arial, sans-serif" font-size="13" fill="#aaa6c3" text-anchor="middle" letter-spacing="1">MRI TUMOR CLASSIFICATION</text>
</svg>
